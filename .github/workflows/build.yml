name: بناء APK للعبة

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز المشروع وبناء الـAPK
        run: |
          set -e
          # إذا رفعت المشروع كملف game3d.zip نفك ضغطه تلقائياً
          if [ -f game3d.zip ]; then unzip -o game3d.zip || jar xf game3d.zip; fi
          PROJ=$(dirname "$(find . -name project.godot -not -path './.git/*' | head -n1)")
          echo "مجلد المشروع: $PROJ"

          # قوالب التصدير
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ "$HOME" != "/root" ] && [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          fi

          # مفتاح التوقيع (debug)
          KS="$HOME/debug.keystore"
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -alias androiddebugkey \
            -keypass android -keystore "$KS" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac)")")")}"
          echo "SDK=$SDK  JDK=$JDK"

          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > "$HOME/.config/godot/$f" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          SETTINGS
          done

          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$PROJ"
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/OmniForge3D.apk"
          ls -lh "$GITHUB_WORKSPACE/build"

      - name: رفع الـAPK
        uses: actions/upload-artifact@v4
        with:
          name: OmniForge3D-APK
          path: build/OmniForge3D.apk
